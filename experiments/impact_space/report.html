<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIC impact report</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --accent: #0969da; --row: #f6f8fa; --code: #eff1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --accent: #4493f8; --row: #151b23; --code: #262c36;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
    --accent: #4493f8; --row: #151b23; --code: #262c36;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  a { color: var(--accent); }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  h2 { font-size: 20px; margin-top: 32px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; word-break: break-word; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; margin: 12px 0; min-width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--row); }
  tr:nth-child(even) td { background: var(--row); }
  li { margin: 3px 0; }
  #error { color: #cf222e; }
</style>
</head>
<body>
<main>
  <header>
    <a href="index.html">← Overview</a> ·
    Updated daily by
    <a href="https://github.com/huggingface/transformers-mic/blob/main/.github/workflows/mic-impact.yml">mic-impact.yml</a>
    · raw data and verdicts on the
    <a href="https://github.com/huggingface/transformers-mic/tree/impact-results">impact-results branch</a>
    · <span id="updated"></span>
  </header>
  <article id="content">Loading…</article>
  <p id="error"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
  // The summary quotes PR titles and failure messages: sanitize before rendering.
  fetch("summary.md", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("summary.md: HTTP " + r.status); return r.text(); })
    .then((text) => {
      const html = DOMPurify.sanitize(marked.parse(text));
      const content = document.getElementById("content");
      content.innerHTML = html;
      content.querySelectorAll("table").forEach((table) => {
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        table.replaceWith(wrap);
        wrap.appendChild(table);
      });
      content.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
    })
    .catch((e) => {
      document.getElementById("content").textContent = "";
      document.getElementById("error").textContent = "Could not load the summary: " + e.message;
    });
  fetch("updated.txt", { cache: "no-store" }).then((r) => r.ok ? r.text() : "").then((t) => {
    if (t) document.getElementById("updated").textContent = "last run " + t.trim();
  });
</script>
</body>
</html>
