  "local_patches": {
    "masked-spec-embed-init": "https://github.com/huggingface/transformers/issues/49385: masked_spec_embed is left uninitialized when a checkpoint lacks it (wav2vec2-base-960h does), so SpecAugment training reads garbage; initialize it with init.uniform_ like HuBERT. Remove and re-record the Wav2Vec2 baselines once fixed upstream.",
    "whisper-decode-tensor-batch": "https://github.com/huggingface/transformers/issues/49403: WhisperTokenizer.decode only batches a list of lists, so processor.batch_decode(model.generate(..., return_timestamps=True), decode_with_timestamps=True) merges the rows of the generated tensor into one string or raises; #47997 fixed lists only. Convert a 2-D tensor to a list first. Remove once fixed upstream.",
    "config-field-generation-params": "https://github.com/huggingface/transformers/issues/49456: since #48282 (d4f69a869d), PreTrainedConfig._get_generation_parameters counts config fields whose default is None as user-set generation parameters, so generate() raises on every Whisper checkpoint whose config.json sets suppress_tokens (all OpenAI ones). Skip the config class's declared fields, as before. Remove once fixed upstream."
