name: MIC coverage Space

# Refresh https://huggingface.co/spaces/huggingface-mic/mic-coverage from the live fleet with the
# Space's own tools/update.py: Done/Reachable states, a shrink page for every new or changed
# fixture, gating and the CI dot. tmic-run.yml dispatches it after each export; the daily run
# catches anything else (a hand export, a missed dispatch). Refreshes queue, never overlap:
# two uploads of data.json from different fleet revisions would race.
#
#   gh workflow run coverage-space.yml --repo huggingface/transformers-mic

on:
  schedule:
    - cron: "30 12 * * *" # after mic-impact (09:00) and its drafts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mic-coverage-space
  cancel-in-progress: false

jobs:
  refresh:
    # The write token is an environment secret; the environment only admits main.
    environment: mic-publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        # Shrink pages build every fleet model on the meta device (configs only, no weights and no
        # contract code): transformers main knows every fleet model type.
        run: |
          git clone --quiet --filter=blob:none https://github.com/huggingface/transformers.git "$RUNNER_TEMP/transformers"
          git clone --quiet --depth 1 https://github.com/huggingface/transformers-ci.git "$RUNNER_TEMP/transformers-ci"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install --quiet -e ".[runtime]" -e "$RUNNER_TEMP/transformers"
      - name: Download the Space
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('huggingface-mic/mic-coverage', repo_type='space', local_dir='space')"
      - name: Refresh and upload
        env:
          HF_TOKEN: ${{ secrets.MIC_BASELINE_WRITE_TOKEN }}
        run: |
          set -o pipefail
          test -n "$HF_TOKEN" || { echo "Configure MIC_BASELINE_WRITE_TOKEN in the mic-publish environment"; exit 1; }
          python space/tools/update.py --tci "$RUNNER_TEMP/transformers-ci" --mic "$GITHUB_WORKSPACE" \
            --python "$(command -v python)" --upload | tee -a "$GITHUB_STEP_SUMMARY"
