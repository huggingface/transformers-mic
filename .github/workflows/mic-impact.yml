name: MIC impact

# Daily evidence for "should a red MIC block a Transformers merge?": reads the
# dashboard's MIC failures (/d/mic-failures), classifies each PR failure (infra,
# failing on main too, or PR-only), follows PR-only cases to an outcome, counts
# baseline changes published to the fleet, replays blocking on every merged PR,
# rewrites summary.md on the impact-results branch, and publishes it to the
# huggingface-mic/mic-impact Space. It also suggests contracts to add (models
# with real-checkpoint regressions and no contract) and drafts the top two a day
# with tmic-run.yml, which publishes a draft that passes on cloud CPU and CUDA into the
# prototypes fleet (new contracts only). Observational: it never
# comments on a PR and never fails because of what it finds.
#
#   gh workflow run mic-impact.yml --repo huggingface/transformers-mic             # yesterday
#   gh workflow run mic-impact.yml --repo huggingface/transformers-mic -f days=30  # re-seed a month
#
# When a tmic-run.yml run finishes, it only refreshes the drafts' state and shrink
# pages (--refresh): no collection, no new drafts. The Space's front page is
# overview.json; the full report is report.html (summary.md).
#
# Verdicts (real-bug / intended / false-alarm / flake) are added by hand to
# labels.jsonl on the impact-results branch; the next run picks them up.

on:
  workflow_run:
    workflows: ["tmic run"]
    types: [completed]
  schedule:
    - cron: "0 9 * * *" # 10:00 CET (11:00 CEST), after the daily GPU CI has been bisected
  workflow_dispatch:
    inputs:
      days:
        description: "Window ending today: 1 daily, 30 to seed from the dashboard's history"
        required: false
        type: choice
        options: ["1", "7", "14", "30"]
        default: "1"
      drafts:
        description: "Contracts to draft with tmic-run.yml from the suggestions (0 to skip)"
        required: false
        type: string
        default: "2"

permissions: {}

concurrency:
  group: mic-impact
  cancel-in-progress: false

jobs:
  observe:
    permissions:
      contents: write
      actions: write # dispatch tmic-run.yml drafts; read their shrink artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      DAYS: ${{ inputs.days || '1' }}
      DRAFTS: ${{ inputs.drafts || '2' }}
      HAS_SPACE_TOKEN: ${{ secrets.MIC_IMPACT_SPACE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - run: python -m pip install .

      - name: Results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/impact-results"
          if git fetch --quiet origin impact-results:refs/remotes/origin/impact-results; then
            git worktree add --quiet -B impact-results "$dir" origin/impact-results
          else
            git worktree add --quiet --orphan -b impact-results "$dir"
            # The first run seeds from the dashboard's 30 days of history.
            echo "DAYS=30" >> "$GITHUB_ENV"
          fi
          echo "RESULTS=$dir" >> "$GITHUB_ENV"

      - name: Observe
        run: |
          set -o pipefail  # a crashed collection must not be published and pushed
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then mode=(--refresh); else mode=(--days "$DAYS" --draft "$DRAFTS"); fi
          python experiments/impact.py --results "$RESULTS" "${mode[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the page
        # The Space renders overview.json and summary.md, and hosts the drafts' shrink pages;
        # the branch above stays the record.
        if: ${{ env.HAS_SPACE_TOKEN == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.MIC_IMPACT_SPACE_TOKEN }}
        run: python experiments/impact.py --results "$RESULTS" --summary-only --publish-space huggingface-mic/mic-impact > /dev/null

      - name: Push
        run: |
          cd "$RESULTS"
          git add -A
          git diff --cached --quiet && exit 0
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then title="MIC impact drafts refresh"; else title="MIC impact $(date -u +%F) (window ${DAYS}d)"; fi
          git commit --quiet -m "$title"
          for i in 1 2 3; do
            git push --quiet origin impact-results && exit 0
            # A hand-added label landed meanwhile: keep it, redo the summary on top.
            git pull --quiet --rebase -X theirs origin impact-results || true
            python "$GITHUB_WORKSPACE/experiments/impact.py" --results "$RESULTS" --summary-only > /dev/null
            git add -A && git commit --quiet -m "MIC impact summary" || true
          done
          exit 1
