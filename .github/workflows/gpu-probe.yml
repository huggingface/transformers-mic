name: Qwen3.6 MoE SSD side-by-side

# Task-branch experiment: the same pinned Qwen3.6-35B-A3B weights on one A10G (24 GB) per engine.
# Transformers (SSD streaming POC), vanilla Transformers (Accelerate offload) and vLLM read the BF16 safetensors;
# llama.cpp reads a BF16 GGUF converted from those safetensors, and the Unsloth Q8_0 GGUF that Strata requires.

on:
  workflow_dispatch:
    inputs:
      machine_type:
        description: Approved single GPU MIC runner
        type: choice
        options: [aws-g5-4xlarge-cache]
        default: aws-g5-4xlarge-cache
      max_tokens:
        description: Generated tokens per request (greedy, same prompt for every engine)
        default: '32'

permissions:
  contents: read

jobs:
  prepare:
    runs-on:
      group: '${{ inputs.machine_type }}'
    timeout-minutes: 150
    container:
      image: huggingface/transformers-all-latest-gpu
      options: --shm-size "16gb" -v /mnt/cache/.cache/huggingface:/mnt/cache/
    env:
      HF_HOME: /mnt/cache
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download pinned weights and convert the BF16 GGUF
        run: bash experiments/ssd-moe/prepare.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qwen36-prepare
          path: out/
          retention-days: 14

  engine:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - engine: transformers-streaming
            image: huggingface/transformers-all-latest-gpu
          - engine: transformers-offload
            image: huggingface/transformers-all-latest-gpu
          - engine: vllm
            image: vllm/vllm-openai:v0.32.0
          - engine: llamacpp-bf16
            image: ghcr.io/ggml-org/llama.cpp:full-cuda-b11977
          - engine: llamacpp-q8_0
            image: ghcr.io/ggml-org/llama.cpp:full-cuda-b11977
          - engine: strata
            image: ghcr.io/niko1221/strata:0.2.12-cuda13
    name: ${{ matrix.engine }}
    runs-on:
      group: '${{ inputs.machine_type }}'
    timeout-minutes: 150
    container:
      image: ${{ matrix.image }}
      options: >-
        --gpus all --shm-size "16gb" --ipc host --ulimit memlock=-1:-1
        -e NVIDIA_DRIVER_CAPABILITIES=compute,utility
        -v /mnt/cache/.cache/huggingface:/mnt/cache/
    env:
      HF_HOME: /mnt/cache
      HF_HUB_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: '0'
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      MAX_TOKENS: ${{ inputs.max_tokens }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: startsWith(matrix.engine, 'transformers')
        with:
          repository: huggingface/transformers
          ref: 158f872ebb33a59f992f69a3abccc6472c548c3f
          path: framework
      - name: Run ${{ matrix.engine }}
        shell: bash
        run: bash experiments/ssd-moe/run_engine.sh '${{ matrix.engine }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qwen36-${{ matrix.engine }}
          path: out/
          retention-days: 14

  summary:
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: qwen36-*
          path: results
          merge-multiple: true
      - name: Build the comparison table
        run: python3 experiments/ssd-moe/summarize.py results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qwen36-side-by-side
          path: results/
          retention-days: 14
