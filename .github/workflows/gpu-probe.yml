name: Qwen3.6 MoE SSD side-by-side

# Task-branch experiment: the same pinned Qwen3.6-35B-A3B weights on one A10G (24 GB) per engine.
# Transformers (SSD streaming POC), vanilla Transformers (Accelerate offload) and vLLM read the BF16 safetensors;
# llama.cpp reads a BF16 GGUF converted from those safetensors, and the Unsloth Q8_0 GGUF that Strata requires.

on:
  workflow_dispatch:
    inputs:
      machine_type:
        description: Approved single GPU MIC runner
        type: choice
        options: [aws-g5-4xlarge-cache]
        default: aws-g5-4xlarge-cache
      engines:
        description: JSON list of engines to run
        default: '["transformers-streaming", "transformers-offload", "vllm", "llamacpp-bf16", "llamacpp-q8_0", "strata"]'
      max_tokens:
        description: Generated tokens per request (greedy, same prompt for every engine)
        default: '32'
      memory_limit:
        description: RAM cap for each engine container (docker --memory, e.g. 12g); empty = the pod's limit
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on:
      group: '${{ inputs.machine_type }}'
    timeout-minutes: 150
    container:
      image: huggingface/transformers-all-latest-gpu
      options: --shm-size "16gb" -v /mnt/cache/.cache/huggingface:/mnt/cache/
    env:
      HF_HOME: /mnt/cache
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download pinned weights and convert the BF16 GGUF
        run: bash experiments/ssd-moe/prepare.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qwen36-prepare
          path: out/
          retention-days: 14

  engine:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        engine: ${{ fromJSON(inputs.engines) }}
    name: ${{ matrix.engine }}
    runs-on:
      group: '${{ inputs.machine_type }}'
    timeout-minutes: 150
    container:
      image: >-
        ${{ fromJSON('{"transformers-streaming": "huggingface/transformers-all-latest-gpu",
        "transformers-offload": "huggingface/transformers-all-latest-gpu",
        "vllm": "vllm/vllm-openai:v0.32.0",
        "llamacpp-bf16": "ghcr.io/ggml-org/llama.cpp:full-cuda-b11977",
        "llamacpp-q8_0": "ghcr.io/ggml-org/llama.cpp:full-cuda-b11977",
        "strata": "ghcr.io/niko1221/strata:0.2.12-cuda13"}')[matrix.engine] }}
      options: >-
        --gpus all --shm-size "16gb" --ipc host --ulimit memlock=-1:-1
        -e NVIDIA_DRIVER_CAPABILITIES=compute,utility
        -v /mnt/cache/.cache/huggingface:/mnt/cache/
        ${{ inputs.memory_limit && format('--memory {0} --memory-swap {0}', inputs.memory_limit) || '' }}
    env:
      HF_HOME: /mnt/cache
      HF_HUB_OFFLINE: '1'
      MEMORY_LIMIT: ${{ inputs.memory_limit }}
      CUDA_VISIBLE_DEVICES: '0'
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      MAX_TOKENS: ${{ inputs.max_tokens }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: startsWith(matrix.engine, 'transformers')
        with:
          repository: huggingface/transformers
          ref: 158f872ebb33a59f992f69a3abccc6472c548c3f
          path: framework
      - name: Run ${{ matrix.engine }}
        shell: bash
        run: bash experiments/ssd-moe/run_engine.sh '${{ matrix.engine }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qwen36-${{ matrix.engine }}
          path: out/
          retention-days: 14

  summary:
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: qwen36-*
          path: results
          merge-multiple: true
      - name: Build the comparison table
        run: |
          echo "Memory limit per engine container: ${{ inputs.memory_limit || 'none (pod limit)' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 experiments/ssd-moe/summarize.py results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qwen36-side-by-side${{ inputs.memory_limit && format('-mem{0}', inputs.memory_limit) || '' }}
          path: results/
          retention-days: 14
