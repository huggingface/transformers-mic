name: Release

on:
  push:
    tags:
      - v*
    branches:
      - "v*-release"

permissions: {}

jobs:
  build_and_test:
    permissions:
      contents: read
    name: build release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[runtime,dev]"
      - run: python -m pytest tests/ -q
      - run: make build-release

      - run: python -m pip uninstall -y transformers-mic
      - run: python -m pip install dist/*.whl

      - name: check the installed wheel
        run: |
          cd /tmp
          expected=$(python -c "import tomllib; print(tomllib.load(open('$GITHUB_WORKSPACE/pyproject.toml', 'rb'))['project']['version'])")
          test "$(tmic --version)" = "$expected"
          test "$(python -m transformers_mic --version)" = "$expected"
          python -c "import transformers_mic; assert transformers_mic.__version__ == '$expected'"
          python -c "from importlib.resources import files; p = files('transformers_mic'); assert (p / '_backend' / 'run.py').is_file(); assert any((p / '_catalog' / 'hub').iterdir())"
          tmic run --help > /dev/null

      - run: python -m twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-dist
          path: dist/**

  upload_package:
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
