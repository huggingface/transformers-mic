name: Sentence Transformers nightly

on:
  push:
    branches: [sentence-transformers-integration]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      model_repo:
        description: Optional preview MIC repo (otherwise select from the fleet)
        type: string
        default: ''
      model_revision:
        description: Immutable preview MIC commit SHA (requires model_repo)
        type: string
        default: ''
      dependency:
        description: Sentence Transformers source
        type: choice
        options: [main, release]
        default: main
      mode:
        description: Check reviewed baselines or record candidates for review
        type: choice
        options: [check, record]
        default: check

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      DEPENDENCY: ${{ inputs.dependency || 'main' }}
      MODE: ${{ inputs.mode || (github.event_name == 'push' && 'record') || 'check' }}
      MODEL_REPO: ${{ inputs.model_repo || (github.event_name == 'push' && 'huggingface-mic/embeddinggemma-2-mic') || '' }}
      MODEL_REVISION: ${{ inputs.model_revision || (github.event_name == 'push' && 'a0787fefb042bed5f323e35d5edeaf4e979ce4f8') || '' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Start result collection
        run: |
          mkdir -p out/sentence-transformers
          date -u +%Y-%m-%dT%H:%M:%SZ > out/sentence-transformers/started-at.txt
      - name: Install
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e '.[runtime]' torchvision \
            'transformers @ git+https://github.com/huggingface/transformers.git@main' \
            'hf-doc-builder @ git+https://github.com/huggingface/doc-builder.git@main'
          if [ "$DEPENDENCY" = main ]; then
            python -m pip install 'sentence-transformers @ git+https://github.com/huggingface/sentence-transformers.git@main'
          else
            python -m pip install --upgrade sentence-transformers
          fi
          mkdir -p out/sentence-transformers
          python -m pip freeze > out/sentence-transformers/pip-freeze.txt
      - name: Check selected MICs
        run: python .github/scripts/sentence_transformers_nightly.py --mode "$MODE" --model-repo "$MODEL_REPO" --model-revision "$MODEL_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sentence-transformers-results
          path: out/sentence-transformers

  publish-results:
    needs: fixtures
    if: always() && github.ref == 'refs/heads/main'
    environment: mic-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sentence-transformers-results-space
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true # Installation failures can leave no results artifact.
        with:
          name: sentence-transformers-results
          path: out/sentence-transformers
      - name: Publish run results
        env:
          HF_TOKEN: ${{ secrets.MIC_BASELINE_WRITE_TOKEN }}
          CONCLUSION: ${{ needs.fixtures.result }}
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'record') || 'check' }}
        run: |
          test -n "$HF_TOKEN" || { echo "Configure MIC_BASELINE_WRITE_TOKEN in mic-publish"; exit 1; }
          python -m pip install huggingface-hub
          mkdir -p out/sentence-transformers
          python tools/update_sentence_transformers_space.py \
            --results out/sentence-transformers --conclusion "$CONCLUSION" --mode "$MODE" --execute
