name: Sentence Transformers nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      model_repo:
        description: Optional preview MIC repo (otherwise select from the fleet)
        type: string
        default: ''
      model_revision:
        description: Immutable preview MIC commit SHA (requires model_repo)
        type: string
        default: ''
      mode:
        description: Check reviewed baselines or record candidates for review
        type: choice
        options: [check, record]
        default: check

permissions:
  contents: read

jobs:
  fixtures:
    # The pool Transformers' contract checks use: native bfloat16 (AMX) on every
    # host, so bfloat16 contracts always meet their cpu-x86_64-bf16 baselines.
    # ubuntu-latest alternated between CPUs with and without it.
    runs-on:
      group: ${{ vars.MIC_CPU_BASELINE_RUNNER || 'aws-m8i-l-cache' }}
    container:
      image: ${{ vars.MIC_CPU_BASELINE_IMAGE || 'huggingface/transformers-torch-light' }}
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      MODE: ${{ inputs.mode || 'check' }}
      MODEL_REPO: ${{ inputs.model_repo }}
      MODEL_REVISION: ${{ inputs.model_revision }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Native bfloat16 host
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          python --version
          grep -qwE 'amx_bf16|avx512_bf16' /proc/cpuinfo || { echo "::error::wrong hardware: no native bfloat16 on this host"; exit 1; }
      - name: Start result collection
        run: |
          mkdir -p out/sentence-transformers
          date -u +%Y-%m-%dT%H:%M:%SZ > out/sentence-transformers/started-at.txt
      - name: Install
        run: |
          # torch comes from the pinned image: the baselines are recorded against it.
          python -m pip install -e '.[runtime]' \
            'hf-doc-builder @ git+https://github.com/huggingface/doc-builder.git@main'
      - name: Install and verify latest upstream mains
        run: python .github/scripts/install_sentence_transformers_main.py
      - name: Check selected MICs
        run: python .github/scripts/sentence_transformers_nightly.py --mode "$MODE" --model-repo "$MODEL_REPO" --model-revision "$MODEL_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sentence-transformers-results
          path: out/sentence-transformers

  publish-results:
    needs: fixtures
    if: always() && github.ref == 'refs/heads/main'
    environment: mic-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sentence-transformers-results-space
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true # Installation failures can leave no results artifact.
        with:
          name: sentence-transformers-results
          path: out/sentence-transformers
      - name: Publish run results
        env:
          HF_TOKEN: ${{ secrets.MIC_BASELINE_WRITE_TOKEN }}
          CONCLUSION: ${{ needs.fixtures.result }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          test -n "$HF_TOKEN" || { echo "Configure MIC_BASELINE_WRITE_TOKEN in mic-publish"; exit 1; }
          python -m pip install huggingface-hub
          mkdir -p out/sentence-transformers
          python tools/update_sentence_transformers_space.py \
            --results out/sentence-transformers --conclusion "$CONCLUSION" --mode "$MODE" --execute
