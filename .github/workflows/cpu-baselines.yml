name: CPU baselines

# Record candidate cpu-x86_64 baselines for every Transformers target and CPU
# variant, with the fleet lock's pinned environment (.github/scripts/cpu_baselines.sh).
# Each candidate is rerun in a fresh process and must agree within tolerance.
# Candidates are uploaded as an artifact, never committed: a reviewer compares
# them with the cpu-arm64 ones and renames them to approve.
#
#   machine=github    GitHub-hosted ubuntu-latest (7 GB RAM here: targets that need
#                     more, such as SmolLM-1.7B, are reported unsupported)
#   machine=gpu-host  the CPU of a Transformers GPU runner (aws-g5-4xlarge-cache:
#                     16 vCPUs, 64 GB), with CPU-only torch so no GPU is used
#
#   gh workflow run cpu-baselines.yml --repo huggingface/model-integration-contracts -f machine=gpu-host
#   gh run download <run-id> --repo huggingface/model-integration-contracts -n cpu-baselines-gpu-host

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "github or gpu-host"
        required: false
        type: string
        default: github
      transformers_sha:
        # Same tree as 4d536e1f, the build the cpu-arm64 and cuda baselines were recorded on.
        description: "Transformers commit to install"
        required: false
        type: string
        default: 8625785e7e3e138a328ec2e678dc198e356e7c6c
      variants:
        required: false
        type: string
        default: default eager

permissions:
  contents: read

env:
  SHA: ${{ inputs.transformers_sha }}
  VARIANTS: ${{ inputs.variants }}
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  github:
    if: inputs.machine == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Record and check
        env:
          PY: python
          OUT: ${{ github.workspace }}/out
        run: .github/scripts/cpu_baselines.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpu-baselines-github
          path: out/

  gpu-host:
    if: inputs.machine == 'gpu-host'
    runs-on:
      group: aws-g5-4xlarge-cache
    timeout-minutes: 120
    container:
      image: huggingface/transformers-all-latest-gpu
      # No --gpus: the contracts must run on the CPU.
      options: --shm-size "16gb" --ipc host -v /mnt/cache/.cache/huggingface:/mnt/cache/
    env:
      HF_HOME: /mnt/cache
      CUDA_VISIBLE_DEVICES: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # github.workspace is the host path; steps run in the container (/__w/...).
      - name: Record and check
        env:
          PY: python3
          REQUIRE_ALL: "1"  # 64 GB: every target fits, so no skip but the manifest's
        run: OUT="$GITHUB_WORKSPACE/out" .github/scripts/cpu_baselines.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpu-baselines-gpu-host
          path: out/
