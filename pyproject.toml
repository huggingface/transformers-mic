[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformers-mic"
version = "0.1.4"
description = "Build and validate model integration contracts and slim fixtures for Transformers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "The Hugging Face Team", email = "transformers@huggingface.co" },
]
keywords = ["transformers", "huggingface", "testing", "ci", "model-integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["huggingface-hub>=1.32", "jsonschema>=4.23", "filelock>=3"]

[project.optional-dependencies]
runtime = ["transformers>=5", "torch>=2.11", "torchvision", "torchaudio", "numpy", "pillow", "soundfile", "librosa", "scipy", "safetensors", "sentencepiece", "protobuf", "accelerate", "sacremoses", "mistral-common", "fugashi", "unidic-lite", "num2words", "timm"]
dev = ["pytest>=8", "build", "twine", "sentencepiece", "ruff==0.17.1"]
sentence-transformers = ["sentence-transformers>=6.2"]

[project.scripts]
tmic = "transformers_mic.cli:main"
transformers-mic = "transformers_mic.cli:main"

[project.urls]
Homepage = "https://github.com/huggingface/transformers-mic"
Repository = "https://github.com/huggingface/transformers-mic"
Changelog = "https://github.com/huggingface/transformers-mic/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
transformers_mic = ["consolidation.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Python only: Markdown code blocks (usage.md in contracts) are data, not code to restyle.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# An explicit list, so a ruff upgrade does not change what CI enforces.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # the formatter wraps code; long strings and comments stay readable as they are
    "E731",  # short lambdas as test stubs
]

[tool.ruff.lint.per-file-ignores]
# These put example/ or experiments/ on sys.path before importing from them.
"tests/**" = ["E402"]
"example/**" = ["E402"]
"experiments/**" = ["E402"]
